# Nginx Virtual Host Template Configuration for CampusEdge Launchpad

server {
    listen 80;
    server_name campusedge.in www.campusedge.in;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name campusedge.in www.campusedge.in;

    ssl_certificate /etc/letsencrypt/live/campusedge.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusedge.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static React Client served via PM2/serve on 5173
    location / {
        proxy_pass http://localhost:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Express API server on 3001
    location /api/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO Real-time Server
    location /socket.io/ {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
